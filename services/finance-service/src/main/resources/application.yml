server:
  port: 8081

spring:
  application:
    name: orvion-finance-service
  config:
    import: optional:configserver:http://config-admin:C0nfig@Admin2024@localhost:8889
  datasource:
    url: jdbc:postgresql://localhost:5432/orvion_finance
    username: orvion_finance_user
    password: Fin@nce2024
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      password: 'Redi$@Orv10n2024'
      timeout: 3000ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/orvion

grpc:
  server:
    port: 9091

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: Orvion Finance Service API
    description: Financial Management API for Orvion ERP
    version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: development
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.90, 0.95, 0.99
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-NO_TRACE}] [%X{tenantId:-NO_TENANT}] %-5level %logger{36} - %msg%n"
  level:
    com.orvion: DEBUG
    org.springframework.security: INFO
    org.flywaydb: DEBUG
