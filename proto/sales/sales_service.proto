syntax = "proto3";
option java_package = "com.orvion.sales.grpc";
option java_multiple_files = true;
package sales;

service SalesService {
  rpc GetCustomerInfo (CustomerInfoRequest) returns (CustomerInfoResponse);
  rpc GetSalesPipeline (PipelineRequest) returns (PipelineResponse);
}

message CustomerInfoRequest {
  string customer_id = 1;
  string tenant_id = 2;
}

message CustomerInfoResponse {
  string customer_id = 1;
  string name = 2;
  string credit_limit = 3;
  string outstanding = 4;
}

message PipelineRequest {
  string tenant_id = 1;
}

message PipelineResponse {
  int32 total_opportunities = 1;
  string total_expected_value = 2;
  map<string, int32> by_stage = 3;
}
