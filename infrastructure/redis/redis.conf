# ============================================================
# Orvion ERP — Redis Configuration
# ============================================================
# This file is managed by the Orvion ERP infrastructure setup.
# ============================================================

# --- Network ---
bind 127.0.0.1
port 6379

# --- Security ---
requirepass Redi$@Orv10n2024

# --- Memory Management ---
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- Persistence (RDB snapshots) ---
save 900 1
save 300 10
save 60 10000

# --- Persistence (AOF) ---
appendonly yes
appendfsync everysec

# --- Database Configuration ---
databases 16

# --- Logging ---
loglevel notice
logfile /opt/homebrew/var/log/redis-orvion.log

# --- Monitoring ---
latency-monitor-threshold 10

# ============================================================
# Redis Database Index Assignments for Orvion ERP
# ============================================================
# DB 0  — Finance Service cache
# DB 1  — Inventory Service cache
# DB 2  — HCM Service cache
# DB 3  — Manufacturing Service cache
# DB 4  — Sales CRM Service cache
# DB 5  — Notification Service cache
# DB 6  — Reporting Service cache
# DB 7  — Session & Token cache (Gateway)
# DB 8  — Rate limiting counters (Gateway)
# DB 9  — (unassigned / reserved)
# DB 10 — (unassigned / reserved)
# DB 11 — (unassigned / reserved)
# DB 12 — (unassigned / reserved)
# DB 13 — (unassigned / reserved)
# DB 14 — (unassigned / reserved)
# DB 15 — Distributed locks (Redisson)
# ============================================================
