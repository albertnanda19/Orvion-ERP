server:
  port: 8083

spring:
  application:
    name: orvion-hcm-service
  config:
    import: optional:configserver:http://config-admin:C0nfig@Admin2024@localhost:8889
  datasource:
    url: jdbc:postgresql://localhost:5432/orvion_hcm
    username: orvion_hcm_user
    password: Hcm@2024
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    schemas: public
    default-schema: public
    create-schemas: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  data:
    redis:
      database: 2
      host: localhost
      port: 6379
      password: Redi$@Orv10n2024
  rabbitmq:
    host: localhost
    port: 5672
    username: orvion
    password: 0rv1onR4bb1t
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000
          multiplier: 2.0
        default-requeue-rejected: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/orvion

grpc:
  server:
    port: 9093
  client:
    finance-service:
      address: static://localhost:9091
      negotiation-type: plaintext

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: orvion-hcm-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        sliding-window-size: 10
        minimum-number-of-calls: 5
    instances:
      finance-grpc-cb:
        base-config: default

logging:
  level:
    com.orvion: DEBUG
    org.springframework: WARN
